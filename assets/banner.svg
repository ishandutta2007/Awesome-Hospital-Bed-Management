<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d19" />
      <stop offset="40%" stop-color="#0a192f" />
      <stop offset="80%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#081426" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accentTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.04); }
      }
      @keyframes telemetryWave {
        0% { stroke-dashoffset: 800; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes bedOccupancyBlink {
        0%, 100% { fill: #10b981; }
        50% { fill: #06b6d4; }
      }

      .pulse-bg {
        animation: pulseGlow 6s ease-in-out infinite alternate;
        transform-origin: 950px 180px;
      }
      .telemetry-line {
        stroke-dasharray: 400 400;
        animation: telemetryWave 3.5s linear infinite;
      }
      .floating-card {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .pulse-dot {
        animation: bedOccupancyBlink 2.5s ease-in-out infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
      }
      .mono-text {
        font-family: 'SF Mono', Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
      }
    </style>
  </defs>

  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="840" y1="0" x2="840" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
    <line x1="1080" y1="0" x2="1080" y2="360" />
  </g>

  <circle cx="950" cy="180" r="160" fill="#0284c7" opacity="0.25" filter="url(#glow)" class="pulse-bg" />
  <circle cx="150" cy="80" r="120" fill="#0d9488" opacity="0.18" filter="url(#glow)" />

  <path d="M 40,180 L 280,180 L 305,180 L 318,145 L 332,225 L 345,120 L 362,240 L 375,170 L 388,190 L 400,180 L 700,180 L 725,180 L 738,135 L 752,230 L 765,115 L 782,245 L 795,165 L 808,190 L 820,180 L 1160,180" 
        fill="none" 
        stroke="url(#glowLine)" 
        stroke-width="3.5" 
        class="telemetry-line" 
        filter="url(#subtleGlow)" />

  <g transform="translate(65, 75)">
    <rect x="0" y="0" width="285" height="30" rx="15" fill="#0f2847" stroke="#0ea5e9" stroke-width="1.2" opacity="0.9" />
    <circle cx="16" cy="15" r="5" class="pulse-dot" />
    <text x="32" y="20" fill="#38bdf8" class="mono-text" font-size="11.5" font-weight="600" letter-spacing="1">PATIENT FLOW &amp; CAPACITY MGMT</text>

    <text x="0" y="78" fill="#ffffff" class="title-text" font-size="42" letter-spacing="-0.5">
      Awesome Hospital Bed
    </text>
    <text x="0" y="126" fill="url(#accentCyan)" class="title-text" font-size="42" letter-spacing="-0.5" filter="url(#subtleGlow)">
      Management Systems
    </text>

    <text x="0" y="168" fill="#94a3b8" class="sub-text" font-size="16">
      Curated ecosystem of SaaS platforms, AI patient-flow engines,
    </text>
    <text x="0" y="192" fill="#94a3b8" class="sub-text" font-size="16">
      FHIR interoperability backbones, and open-source hospital operations.
    </text>

    <g transform="translate(0, 216)">
      <rect x="0" y="0" width="145" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="17" fill="#38bdf8" class="mono-text" font-size="11">⚡ Real-Time Census</text>

      <rect x="155" y="0" width="135" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="167" y="17" fill="#34d399" class="mono-text" font-size="11">🤖 AI Flow Demand</text>

      <rect x="300" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="312" y="17" fill="#a78bfa" class="mono-text" font-size="11">🔥 FHIR &amp; Interop</text>
    </g>
  </g>

  <g transform="translate(805, 55)" class="floating-card">
    <rect x="0" y="0" width="330" height="245" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#subtleGlow)" />

    <rect x="0" y="0" width="330" height="38" rx="14" fill="#0f172a" opacity="0.9" />
    <line x1="0" y1="38" x2="330" y2="38" stroke="#1e293b" stroke-width="1" />
    <circle cx="20" cy="19" r="4.5" fill="#ef4444" opacity="0.8" />
    <circle cx="34" cy="19" r="4.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="48" cy="19" r="4.5" fill="#10b981" opacity="0.8" />
    <text x="75" y="24" fill="#94a3b8" class="mono-text" font-size="11.5" font-weight="600">COMMAND_CENTER :: HUD</text>

    <rect x="18" y="52" width="138" height="74" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="0.8" />
    <text x="28" y="72" fill="#94a3b8" class="sub-text" font-size="11">AVAILABLE BEDS</text>
    <text x="28" y="104" fill="#38bdf8" class="title-text" font-size="28">142</text>
    <text x="82" y="104" fill="#10b981" class="mono-text" font-size="12">▲ 92%</text>

    <rect x="174" y="52" width="138" height="74" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
    <text x="184" y="72" fill="#94a3b8" class="sub-text" font-size="11">EXP. DISCHARGES</text>
    <text x="184" y="104" fill="#34d399" class="title-text" font-size="28">38</text>
    <text x="228" y="104" fill="#38bdf8" class="mono-text" font-size="11">/ 4 hrs</text>

    <g transform="translate(18, 138)">
      <rect x="0" y="0" width="294" height="88" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="18" fill="#64748b" class="mono-text" font-size="10.5">UNIT WARD CENSUS MATRIX</text>
      
      <circle cx="22" cy="38" r="5" fill="#10b981" />
      <circle cx="48" cy="38" r="5" fill="#10b981" />
      <circle cx="74" cy="38" r="5" fill="#ef4444" />
      <circle cx="100" cy="38" r="5" fill="#10b981" />
      <circle cx="126" cy="38" r="5" fill="#06b6d4" />
      <circle cx="152" cy="38" r="5" fill="#10b981" />
      <circle cx="178" cy="38" r="5" fill="#ef4444" />
      <circle cx="204" cy="38" r="5" fill="#10b981" />
      <circle cx="230" cy="38" r="5" fill="#f59e0b" />
      <circle cx="256" cy="38" r="5" fill="#10b981" />
      <circle cx="280" cy="38" r="5" fill="#10b981" />

      <circle cx="22" cy="60" r="5" fill="#06b6d4" />
      <circle cx="48" cy="60" r="5" fill="#ef4444" />
      <circle cx="74" cy="60" r="5" fill="#10b981" />
      <circle cx="100" cy="60" r="5" fill="#10b981" />
      <circle cx="126" cy="60" r="5" fill="#10b981" />
      <circle cx="152" cy="60" r="5" fill="#f59e0b" />
      <circle cx="178" cy="60" r="5" fill="#10b981" />
      <circle cx="204" cy="60" r="5" fill="#10b981" />
      <circle cx="230" cy="60" r="5" fill="#10b981" />
      <circle cx="256" cy="60" r="5" fill="#06b6d4" />
      <circle cx="280" cy="60" r="5" fill="#ef4444" />
    </g>
  </g>
</svg>